<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="可愛圖庫 - 提供極致的液態玻璃折射視覺體驗。">
    <title>Meta AI PRO 的貓娘圖庫(◐‿◑)</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&family=Noto+Sans+TC:wght@300;500;700&display=swap"
        rel="stylesheet">
    <!-- Main CSS -->
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>

    <!-- SVG Filters for Liquid Refraction Effects -->
    <!-- DO NOT reference the user's demo. Completely newly generated complex liquid/water filter. -->
    <svg class="svg-defs" width="0" height="0">
        <defs>
            <!-- 1. Mild Liquid Glass State -->
            <filter id="mild-liquid" x="-10%" y="-10%" width="120%" height="120%">
                <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" result="turbulence">
                    <animate attributeName="baseFrequency" values="0.015;0.018;0.015" dur="8s"
                        repeatCount="indefinite" />
                </feTurbulence>
                <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="8" xChannelSelector="R"
                    yChannelSelector="G" result="displaced" />
                <feSpecularLighting in="turbulence" specularConstant="0.6" specularExponent="40" surfaceScale="2"
                    lighting-color="#fff" result="specular">
                    <feDistantLight azimuth="90" elevation="60" />
                </feSpecularLighting>
                <feComposite operator="in" in="specular" in2="displaced" result="lightOverlay" />
                <feComposite operator="arithmetic" k1="0" k2="1" k3="0.8" k4="0" in="displaced" in2="lightOverlay" />
            </filter>

        </defs>
    </svg>

    <!-- Main Content -->
    <header class="page-header" id="header">
        <h1>Meta AI PRO 的貓娘圖庫</h1>
    </header>

    <main class="gallery-container" id="galleryContainer">
        <!-- Javascript will generate the 50 liquid cards here -->
    </main>

    <!-- Script -->
    <script src="static/js/script.js"></script>
</body>

</html>
